name: Release Charts

on:
  push:
    branches:
      - main
    paths:
     - 'charts/**/Chart.yaml'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      #- id: files
      #  uses: jitterbit/get-changed-files@v1
      #- run: |
      #    for changed_file in ${{ steps.files.outputs.all }}; do
      #      echo "Do something with this ${changed_file}."
      #    done
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Add repos
        run:  |
          helm repo add bitnami https://charts.bitnami.com/bitnami
      - name: Run helm-docs
        run: |
          GOBIN=$PWD GO111MODULE=on go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest
          ./helm-docs --sort-values-order file --skip-version-footer
          rm helm-docs
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.PAT }}"
          CR_SKIP_EXISTING: true 

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push released charts to OCI
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No chart packages were generated. Skipping OCI push."
            exit 0
          fi

          for package in "${packages[@]}"; do
            echo "Pushing ${package} to oci://ghcr.io/${{ github.repository_owner }}/publiccharts"
            helm push "${package}" "oci://ghcr.io/${{ github.repository_owner }}/publiccharts"
          done
