# -- Deployment strategy used to replace old Pods with new ones. Defaults to `RollingUpdate`.
deploymentStrategy: ""
image:
  # -- Registry for the container image.
  registry: docker.io
  # -- Repository for the container image.
  repository: nodered/node-red
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag to pull. Defaults to `Chart.appVersion`.
  tag: ""

rbac:
  # If enabled, roles are created and bound to the service account. Defaults to true.
  enabled: true
  # -- Create a ClusterRole for the Node-RED pod. Defaults to false.
  createClusterRole: false

# -- Additional image pull secrets.
imagePullSecrets: ""

# -- Override the release name for the chart.
nameOverride: ""
# -- Fully override the generated name.
fullnameOverride: ""

npmrc:
  # -- Enable custom npmrc configuration.
  enabled: false
  # -- Registry to use for npm packages.
  registry: "https://registry.npmjs.org"
  # -- Custom npmrc content to add.
  content: |
    # Custom npmrc config

# -- Additional environment variables for Node-RED. See the Node-RED documentation for supported values.
env: []
  # Possible Values:
  # TZ:
  # NODE_OPTIONS:
  # NODE_RED_ENABLE_PROJECTS:
  # NODE_RED_ENABLE_SAFE_MODE:
  # FLOWS:
  # example:
  # env:
  # - name: "NODE_RED_ENABLE_SAFE_MODE"
  #   value: ""

# -- Enable Node-RED project mode for Git integration and project management.
# Note: Project mode requires write access to the /data directory and may require
# additional security context adjustments depending on your cluster's policies.
projectMode:
  enabled: false

envFrom: []
  # Possible values:
  # - secretRef:
  #     name: node-red-env

serviceAccount:
  # Specifies whether a service account should be created.
  # -- Create a service account for the workload.
  create: true
  # Annotations to add to the service account.
  # -- Additional annotations for the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated from the fullname template.
  # -- Name of the service account to use.
  name: ""

# -- Additional annotations for the pod.
podAnnotations: {}

# -- Additional annotations for the deployment.
deploymentAnnotations: {}

# -- Pod security context for the workload. See [values.yaml](values.yaml).
podSecurityContext:
  # -- File system group for the pod. Defaults to 1000.
  fsGroup: 1000
  # -- User ID for the pod. Defaults to 1000.
  runAsUser: 1000

# -- Security context for the container. See [values.yaml](values.yaml).
securityContext:
  privileged: false
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Node-RED needs write access for project mode and normal operation.
  runAsGroup: 1000               # Match Node-RED's expected group.
  runAsUser: 1000                # Match Node-RED's expected user.
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  # -- Kubernetes service type.
  type: ClusterIP
  # -- Port exposed by the service.
  port: 1880
  # -- Annotations for the service.
  annotations: {}

# Enable ServiceMonitor for Node-RED.
metrics:
  # -- Enable the metrics service.
  enabled: false
  path: /metrics
  serviceMonitor:
    # -- Enable a Prometheus ServiceMonitor.
    enabled: false
    # -- Basic auth configuration for the ServiceMonitor endpoint.
    basicAuth: {}
    # -- Interval between Prometheus scrapes.
    interval: 30s
    # -- Relabeling rules to apply to scraped samples before they are ingested.
    relabelings: []
    # -- Metric relabeling rules to apply before ingestion.
    metricRelabelings: []
    # -- Selector used by the ServiceMonitor.
    selector: {}
    # prometheus: kube-prometheus

    # -- Namespace for the ServiceMonitor.
    namespace: ""  # "monitoring"
    # -- Additional labels for the ServiceMonitor.
    additionalLabels: {}

persistence:
  # -- Enable persistent storage for Node-RED data.
  enabled: false
  ## Persistent Volume Storage Class for Node-RED data.
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning.
  ## If undefined (the default) or set to null, no storageClassName is set,
  ## choosing the default provisioner. (gp2 on AWS, standard on GKE, AWS, and OpenStack)
  ##
  # -- Type of persistent volume claim to create.
  # storageClass: "-"
  ##
  ## If you want to reuse an existing claim, pass the PVC name using the existingClaim variable.
  # -- Use an existing PVC instead of creating a new one.
  # existingClaim: your-claim
  # -- Access mode for the persistent volume claim.
  accessMode: ReadWriteOnce
  # -- Size of the persistent volume claim.
  size: 5Gi
  # -- Retain the created PVC when uninstalling the chart. Defaults to false.
  keepPVC: false

# -- Init containers to run before the application container starts.
initContainers: []

ingress:
  # -- Enable the ingress resource.
  enabled: false
  # -- Ingress controller class to use.
  className: ""
  # -- Additional ingress annotations.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    # Accepted hostnames for the ingress.
    - host: chart-example.local
      paths:
          # -- Base path for the ingress rule.
        - path: /
          # -- Path type for the ingress rule.
          pathType: ImplementationSpecific
  # -- TLS configuration for the ingress.
  tls: []
    # -- Secret name for the certificate.
    # - secretName: chart-example-tls
    # -- Hostnames covered by the certificate.
    # hosts:
    #  - chart-example.local
    # -- Certificate configuration used by cert-manager.
    # certificate:
    # -- Enable certificate generation.
    #   enabled: true
    # -- Name of the certificate. Defaults to `$fullname-cert-$index`.
    #   name: ""
    # -- Reference to a ClusterIssuer or Issuer.
    #   issuerRef:
    # -- Kind of the referenced issuer.
    #     kind: ClusterIssuer
    # -- Name of the issuer.
    #     name: "test"

httpRoute:
  # -- Enable an HTTPRoute resource for the server.
  enabled: false
  # -- Additional annotations for the HTTPRoute.
  annotations: {}
  # -- Parent references for Gateway API attachment.
  parentRefs: []
  # -- Hostnames exposed by the HTTPRoute.
  hostnames: []
  # -- Rules for forwarding traffic. If backendRefs is empty, traffic is sent to this chart's service.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs: []

# -- Startup probe for the deployment.
startupProbe:
  httpGet:
    path: /
    port: http

# -- Liveness probe for the deployment.
livenessProbe:
  httpGet:
    path: /
    port: http

# -- Readiness probe for the deployment.
readinessProbe:
  httpGet:
    path: /
    port: http

# -- CPU and memory requests and limits for the pod.
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases the chances that the chart runs in environments with limited
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Node selector labels for pod assignment.
nodeSelector: {}

# -- Tolerations for pod assignment.
tolerations: []

# -- Grace period before terminating the pod.
# This value is explicitly set to the Kubernetes default.
# https://github.com/kubernetes/api/blob/d4b94f478bb2e6467873657dd7b4e1b0ac8351be/core/v1/types.go#L3114-L3118
terminationGracePeriodSeconds: 30

# -- Affinity rules for pod scheduling.
affinity: {}

# -- Additional volumes to mount into the pod.
extraVolumes:
# - name: pv-claim
#   persistentVolumeClaim:
#     claimName: task-pv-volume
# - name: example
#   configMap:
#     name: example

# -- Additional volume mounts for the Node-RED pod.
extraVolumeMounts:
# - name: test
#   mountPath: /test

# -- Configuration for the Node-RED settings file. Defaults to {}.
settings: {}
# Details about the content of settings.js. You can find more information in the
# https://nodered.org/docs/user-guide/runtime/settings-file
# The ConfigMap must already exist and the key must be named `settings.js`.
#  name: settings-config
#  configMapName: settings-config

# -- Additional labels to add to the pod. Defaults to {}.
podLabels: {}

# -- Priority class name for the pod. Defaults to empty.
priorityClassName: ""

# -- Additional sidecars to run alongside the Node-RED container. Defaults to [].
extraSidecars: []
#  - name: sidecar-example
#    image: busybox
#    command: ["/bin/sh", "-c", "echo hello from sidecar"]

## -- Enable custom rules for the ClusterRole resource.
clusterRoleRules:
  # -- Enable custom rules for the application controller's ClusterRole resource. Defaults to false.
  enabled: false
  # -- List of custom rules for the application controller's ClusterRole resource. Defaults to [].
  rules: []

# Sidecar that collects ConfigMaps with the specified label and writes the included files into the target directory.
sidecar:
  # -- Enable the sidecar.
  enabled: false
  # Environment variables to pass to the sidecar.
  env:
    # -- Sleep interval for the refresh script.
    sleep_time_sidecar: 5s
    # -- If METHOD is set to LIST, the sidecar lists ConfigMaps and Secrets and exits. With SLEEP, it lists all ConfigMaps and Secrets, waits for the configured duration, and then repeats. Any other value keeps watching for changes.
    method: watch
    # -- Label used to filter watched resources.
    label: node-red-settings
    # -- Label value used to filter watched resources. Leave empty to match any value.
    label_value: "1"
    # -- Absolute path to the shell script to execute after a ConfigMap is reloaded.
    script: flow_refresh.py
    # The username for the API call. See the Node-RED documentation for more information.
    username: ""
    # -- Password as a key/value pair.
    password: ""
    # -- Password from an existing secret.
    passwordFromExistingSecret: {}
    # -- Name of the secret that contains the password.
    #  name: node-red-api-admin-password
    # -- Key of the secret that contains the password.
    #  key: password
    # -- Skip the initial request to REQ_URL when using watch mode (v2.1.0+).
    skip_init: false
    # -- Optional custom target URL for the sidecar. If empty, the in-cluster service URL is used automatically.
    url: ""
  # -- Extra Node modules to install from the sidecar script.
  extraNodeModules: []
  # -- Extra environment variables for the sidecar.
  extraEnv: []
  # -- Resources for the sidecar.
  resources: {}
  # -- Security context for the sidecar.
  securityContext: {}
  # -- Liveness probe for the sidecar. k8s-sidecar v2+ exposes /healthz on port 8080.
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  # -- Readiness probe for the sidecar. Reports ready after the initial sync completes.
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  # Image for the sidecar.
  image:
    # -- Registry for the sidecar image.
    registry: quay.io
    # -- Repository for the sidecar image.
    repository: kiwigrid/k8s-sidecar
    # -- Image tag to pull. Defaults to `2.5.0`.
    tag: 2.5.0
    # -- Image pull policy. Defaults to `IfNotPresent`.
    pullPolicy: IfNotPresent
  # -- Extra volume mounts for the sidecar.
  volumeMounts: []
