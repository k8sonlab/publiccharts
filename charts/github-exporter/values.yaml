# Default values for github-exporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: githubexporter/github-exporter
  pullPolicy: IfNotPresent
  # -- Overrides the image tag. Upstream publishes Docker tags as release-<version>.
  tag:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# -- Environment variables for github-exporter. Set ORGS, REPOS, or USERS to choose what to monitor.
env:
  LISTEN_PORT: "9171"
  METRICS_PATH: /metrics
  LOG_LEVEL: info
  GITHUB_RATE_LIMIT_ENABLED: "true"
  GITHUB_RESULTS_PER_PAGE: "100"
  FETCH_REPO_RELEASES_ENABLED: "true"

# -- Existing secret loaded as environment variables, for example GITHUB_TOKEN or GitHub App credentials.
envSecretName: ""

secret:
  # -- Create a secret from secret.data and load it as environment variables.
  create: false
  # -- Secret name. Defaults to the chart fullname when create is true.
  name: ""
  # -- Secret values exposed as environment variables, such as GITHUB_TOKEN.
  data: {}

service:
  type: ClusterIP
  port: 9171

probes:
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    failureThreshold: 5
    timeoutSeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    path: /metrics
    initialDelaySeconds: 10
    failureThreshold: 5
    timeoutSeconds: 5
    periodSeconds: 20
  startup:
    enabled: true
    path: /
    initialDelaySeconds: 10
    failureThreshold: 60
    timeoutSeconds: 2
    periodSeconds: 5

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

extraVolumes: []

extraVolumeMounts: []

# -- Support Prometheus ServiceMonitor
serviceMonitor:
  # -- enable Service Monitor
  enabled: false
  # -- add Custom labels, for prometheus Service Monitor
  labels: {}
  # -- interval
  interval: 30s
  # -- namespace selector
  namespaceSelector: {}
  # -- endpoint additions - add endpoint modifications
  endpointAdditions: {}
