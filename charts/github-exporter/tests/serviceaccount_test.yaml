suite: github-exporter service account
templates:
  - serviceaccount.yaml

tests:
  - it: renders a service account by default
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: metadata.name

  - it: can disable the service account
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0