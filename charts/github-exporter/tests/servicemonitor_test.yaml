suite: github-exporter service monitor
templates:
  - servicemonitor.yaml

tests:
  - it: does not render a ServiceMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: configures an enabled ServiceMonitor
    set:
      serviceMonitor.enabled: true
      serviceMonitor.interval: 15s
      serviceMonitor.labels.team: platform
      serviceMonitor.endpointAdditions.honorLabels: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true
      - equal:
          path: metadata.labels.team
          value: platform