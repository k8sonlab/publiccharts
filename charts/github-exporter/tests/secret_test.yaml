suite: github-exporter secret
templates:
  - secret.yaml

tests:
  - it: does not render a secret when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders configured secret data
    set:
      secret.create: true
      secret.data.GITHUB_TOKEN: test-token
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.GITHUB_TOKEN
          value: test-token